<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>POLOFLIX – Netflix style</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#141414" />
<style>
*{box-sizing:border-box}
body{margin:0;background:#141414;font-family:Arial,Helvetica,sans-serif;color:#fff}

/* NAV */
.nav{position:fixed;top:0;left:0;width:100%;height:60px;background:rgba(0,0,0,.92);display:flex;align-items:center;padding:0 16px;z-index:1000}
.logo{font-size:26px;font-weight:900;color:#e50914}
#search{margin-left:auto;background:#222;border:none;border-radius:4px;padding:6px 10px;color:#fff;font-size:14px;width:160px}
.profile{margin-left:10px;display:flex;gap:6px}
.profile button{background:#333;color:#fff;border:none;border-radius:4px;padding:6px 8px;cursor:pointer}

/* TABS */
.tabs{margin-top:60px;display:flex;gap:18px;padding:12px 16px;overflow-x:auto;position:sticky;top:60px;background:#141414;z-index:900}
.tab{cursor:pointer;font-weight:700;opacity:.6;white-space:nowrap}
.tab.active{opacity:1;border-bottom:3px solid #e50914;padding-bottom:6px}

/* HERO */
.hero{height:45vh;background:url('https://images.genius.com/4261a39be4b451db207d696dc1ce2be3.1000x1000x1.png') center/cover;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;box-shadow:inset 0 0 250px rgba(0,0,0,.9)}
.hero h1{margin:0;font-size:32px;font-weight:900}
.hero p{font-size:14px;opacity:.85;max-width:360px}
.hero .actions{margin-top:10px;display:flex;gap:10px}
.hero button{background:#fff;border:none;border-radius:4px;padding:8px 12px;font-weight:700;cursor:pointer}

/* SECTIONS */
.section{display:none}
.section.active{display:block}
.row{margin:18px 10px}
.row h2{font-size:18px;margin:0 0 8px 6px}

/* SLIDER */
.slider{position:relative}
.slider .movies{display:flex;gap:10px;overflow-x:auto;scroll-behavior:smooth;padding:10px}
.slider .navbtn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);border:none;color:#fff;font-size:22px;width:36px;height:60px;cursor:pointer}
.slider .prev{left:0}
.slider .next{right:0}

/* MOVIE CARD */
.movie{position:relative;min-width:150px;height:90px;border-radius:4px;overflow:hidden;cursor:pointer;transition:.25s}
.movie img{width:100%;height:100%;object-fit:cover;display:block}
.movie:hover{transform:scale(1.15);z-index:5}

/* HOVER CARD */
.hover{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.9));padding:6px;font-size:12px;opacity:0;transition:.2s}
.movie:hover .hover{opacity:1}
.hover b{display:block;font-size:13px}
.hover .mini{display:flex;gap:6px;margin-top:4px}
.hover button{background:#e50914;border:none;color:#fff;border-radius:3px;padding:3px 6px;font-size:11px;cursor:pointer}

/* PLAYER */
.player-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:2000}
.player-box{width:100%;background:#000}
video{width:100%}
.close{position:absolute;top:15px;right:20px;font-size:40px;cursor:pointer}

/* MODALS */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:3000}
.modal .box{background:#111;padding:20px;border-radius:6px;width:90%;max-width:420px}
.modal h3{margin-top:0}
.modal button{margin-top:10px}

/* 18+ */
.age{position:fixed;inset:0;background:#000;z-index:4000;display:flex;align-items:center;justify-content:center;text-align:center}
.age button{margin-top:20px;padding:12px 20px;font-size:16px;font-weight:700}
</style>
</head>
<body>

<!-- 18+ SCREEN -->
<div class="age" id="age">
  <div>
    <h1>18+</h1>
    <p>Treści tylko dla pełnoletnich</p>
    <button onclick="acceptAge()">Mam 18 lat</button>
  </div>
</div>

<div class="nav">
  <div class="logo">POLOFLIX</div>
  <input id="search" placeholder="Szukaj..." />
  <div class="profile">
    <button onclick="openProfiles()">Profil</button>
    <button onclick="openMyList()">Moja lista</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="t1">Fagata</div>
  <div class="tab" data-tab="t2">Nowe</div>
  <div class="tab" data-tab="t3">Top</div>
  <div class="tab" data-tab="t4">Klasyki</div>
  <div class="tab" data-tab="t5">Inne</div>
</div>

<div class="hero">
  <h1>Hit miesiąca</h1>
  <p>Polo Flix 🔥</p>
  <div class="actions">
    <button onclick="playHero()">▶ Odtwórz</button>
    <button onclick="addToList('hit','Hit miesiąca','https://images.genius.com/4261a39be4b451db207d696dc1ce2be3.1000x1000x1.png')">＋ Dodaj do listy</button>
  </div>
</div>

<!-- TAB 1 -->
<div class="section active" id="t1">
  <div class="row">
    <h2>Polecane</h2>
    <div class="slider">
      <button class="navbtn prev">‹</button>
      <div class="movies">
        <div class="movie" data-id="f1" data-title="Fagata" data-src="https://www.dropbox.com/scl/fi/3qa3grzwhjwzroj78ku6m/Gejostwo-Fagata-Czesc-2.mp4?raw=1" data-trailer="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">
          <img loading="lazy" src="https://www.dropbox.com/scl/fi/r9cutto5jnvxkg6v1ggct/Zrzut-ekranu-2025-12-10-155830.png?raw=1" />
          <div class="hover"><b>Fagata</b><div class="mini"><button onclick="event.stopPropagation();addToList('f1','Fagata',this.closest('.movie').querySelector('img').src)">＋ Lista</button></div></div>
        </div>
      </div>
      <button class="navbtn next">›</button>
    </div>
  </div>
</div>

<!-- TAB 2 -->
<div class="section" id="t2"><div class="row"><h2>Nowe</h2><div class="slider"><button class="navbtn prev">‹</button><div class="movies">
  <div class="movie" data-id="n1" data-title="Sintel" data-src="https://storage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4">
    <img loading="lazy" src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/Sintel_poster.jpg/640px-Sintel_poster.jpg" />
    <div class="hover"><b>Sintel</b><div class="mini"><button onclick="event.stopPropagation();addToList('n1','Sintel',this.closest('.movie').querySelector('img').src)">＋ Lista</button></div></div>
  </div>
</div><button class="navbtn next">›</button></div></div></div>

<!-- TAB 3 -->
<div class="section" id="t3"><div class="row"><h2>Top</h2><div class="slider"><button class="navbtn prev">‹</button><div class="movies">
  <div class="movie" data-id="t1" data-title="Elephants Dream" data-src="https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4">
    <img loading="lazy" src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Elephants_Dream_s1_proog.jpg/640px-Elephants_Dream_s1_proog.jpg" />
    <div class="hover"><b>Elephants Dream</b><div class="mini"><button onclick="event.stopPropagation();addToList('t1','Elephants Dream',this.closest('.movie').querySelector('img').src)">＋ Lista</button></div></div>
  </div>
</div><button class="navbtn next">›</button></div></div></div>

<!-- TAB 4 -->
<div class="section" id="t4"><div class="row"><h2>Klasyki</h2><div class="slider"><button class="navbtn prev">‹</button><div class="movies">
  <div class="movie" data-id="k1" data-title="Flower" data-src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">
    <img loading="lazy" src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?q=80&w=800" />
    <div class="hover"><b>Flower</b><div class="mini"><button onclick="event.stopPropagation();addToList('k1','Flower',this.closest('.movie').querySelector('img').src)">＋ Lista</button></div></div>
  </div>
</div><button class="navbtn next">›</button></div></div></div>

<!-- TAB 5 -->
<div class="section" id="t5"><div class="row"><h2>Inne</h2><div class="slider"><button class="navbtn prev">‹</button><div class="movies">
  <div class="movie" data-id="i1" data-title="Joyrides" data-src="https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4">
    <img loading="lazy" src="https://storage.googleapis.com/gtv-videos-bucket/sample/images/ForBiggerJoyrides.jpg" />
    <div class="hover"><b>Joyrides</b><div class="mini"><button onclick="event.stopPropagation();addToList('i1','Joyrides',this.closest('.movie').querySelector('img').src)">＋ Lista</button></div></div>
  </div>
</div><button class="navbtn next">›</button></div></div></div>

<!-- PLAYER -->
<div class="player-bg" id="playerBg">
  <span class="close" id="closeBtn">&times;</span>
  <div class="player-box"><video id="videoPlayer" controls playsinline></video></div>
</div>

<!-- MODALS -->
<div class="modal" id="profiles"><div class="box"><h3>Profile</h3><p>Demo: Profile lokalne</p><button onclick="setProfile('User')">User</button> <button onclick="setProfile('Guest')">Guest</button><br><button onclick="closeProfiles()">Zamknij</button></div></div>
<div class="modal" id="mylist"><div class="box"><h3>Moja lista</h3><div id="list"></div><button onclick="closeMyList()">Zamknij</button></div></div>

<script>
/* 18+ */
function acceptAge(){document.getElementById('age').style.display='none'}

/* TABS */
const tabs=document.querySelectorAll('.tab');
const sections=document.querySelectorAll('.section');
tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));sections.forEach(s=>s.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.tab).classList.add('active');window.scrollTo({top:0})});

/* SEARCH */
document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.movie').forEach(m=>{m.style.display=m.dataset.title?.toLowerCase().includes(q)?'':'none'})}

/* SLIDER BTNS */
document.querySelectorAll('.slider').forEach(sl=>{
  const box=sl.querySelector('.movies');
  sl.querySelector('.prev').onclick=()=>box.scrollBy({left:-300,behavior:'smooth'});
  sl.querySelector('.next').onclick=()=>box.scrollBy({left:300,behavior:'smooth'});
});

/* PLAYER + TRAILER */
const bg=document.getElementById('playerBg');
const player=document.getElementById('videoPlayer');
document.querySelectorAll('.movie').forEach(m=>{
  m.onclick=()=>{player.muted=false;player.src=m.dataset.src;bg.style.display='flex';player.play()}
  let t;
  m.onmouseenter=()=>{if(m.dataset.trailer){t=setTimeout(()=>{player.muted=true;player.src=m.dataset.trailer;bg.style.display='flex';player.play()},600)}}
  m.onmouseleave=()=>{clearTimeout(t);if(player.muted){player.pause();bg.style.display='none'}}
});
closeBtn.onclick=()=>{player.pause();player.src='';bg.style.display='none'}

/* MY LIST (localStorage) */
function addToList(id,title,thumb){const k='mylist';const l=JSON.parse(localStorage.getItem(k)||'[]');if(!l.find(x=>x.id===id)){l.push({id,title,thumb});localStorage.setItem(k,JSON.stringify(l))}}
function openMyList(){renderList();document.getElementById('mylist').style.display='flex'}
function closeMyList(){document.getElementById('mylist').style.display='none'}
function renderList(){const el=document.getElementById('list');const l=JSON.parse(localStorage.getItem('mylist')||'[]');el.innerHTML=l.map(i=>`<div style="display:flex;gap:8px;margin-bottom:8px"><img src="${i.thumb}" width="80"><div>${i.title}</div></div>`).join('')||'<p>Pusto</p>'}

/* PROFILES (local) */
function openProfiles(){document.getElementById('profiles').style.display='flex'}
function closeProfiles(){document.getElementById('profiles').style.display='none'}
function setProfile(p){localStorage.setItem('profile',p);closeProfiles()}

/* HERO */
function playHero(){document.querySelector('.movie')?.click()}

/* PWA NOTE:
1) Dodaj manifest.json i service-worker.js (cache assets).
2) Zarejestruj SW poniżej.
*/
</script>

</body>
</html>
