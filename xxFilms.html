<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Porno Flix</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
*{box-sizing:border-box}
body{margin:0;background:#141414;font-family:Arial,Helvetica,sans-serif;color:#fff}

/* NAV */
.nav{position:fixed;top:0;left:0;width:100%;height:60px;background:rgba(0,0,0,.95);display:flex;align-items:center;padding:0 16px;z-index:1000}
.logo{font-size:26px;font-weight:900;color:#e50914}
#search{margin-left:auto;background:#222;border:none;border-radius:4px;padding:6px 10px;color:#fff;font-size:14px;width:160px}
.sort{margin-left:8px;background:#222;color:#fff;border:none;border-radius:4px;padding:6px 8px}
.btn{margin-left:8px;background:#333;color:#fff;border:none;border-radius:4px;padding:6px 10px;cursor:pointer}

/* HERO */
.hero{margin-top:60px;height:40vh;background:linear-gradient(to top,rgba(20,20,20,1),rgba(20,20,20,.35)),url('https://i.ytimg.com/vi/U3IO7cOU6OY/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLDXzRZo4r1D34dBUNY2Q-GTJ2R_dw&raw=1') center/cover;display:flex;flex-direction:column;justify-content:flex-end;padding:20px}
.hero h1{margin:0;font-size:32px;font-weight:900}
.hero p{opacity:.8;max-width:360px}

/* TABS */
.tabs{display:flex;gap:18px;padding:12px 16px;overflow-x:auto;position:sticky;top:60px;background:#141414;z-index:900}
.tab{cursor:pointer;font-weight:700;opacity:.6}
.tab.active{opacity:1;border-bottom:3px solid #e50914;padding-bottom:6px}

/* SECTIONS */
.section{display:none}
.section.active{display:block}
.row{margin:18px 10px}
.row h2{font-size:18px;margin:0 0 8px 6px}

/* SLIDER */
.slider{position:relative}
.movies{display:flex;gap:10px;overflow-x:auto;scroll-behavior:smooth;padding:10px}
.navbtn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);border:none;color:#fff;font-size:22px;width:36px;height:60px;cursor:pointer;z-index:5}
.prev{left:0}.next{right:0}

/* MOVIE */
.movie{position:relative;min-width:170px;height:96px;border-radius:4px;overflow:hidden;cursor:pointer;transition:.25s}
.movie:hover{transform:scale(1.15);z-index:10}
.movie img, .movie video{width:100%;height:100%;object-fit:cover;display:block}

/* BADGES */
.badge{position:absolute;top:6px;left:6px;background:#e50914;color:#fff;font-size:10px;font-weight:900;padding:2px 6px;border-radius:3px}
.badge.new{background:#2ecc71}
.views{position:absolute;bottom:6px;right:6px;font-size:10px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:3px}

/* HOVER */
.hover{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:12px;opacity:0;transition:.2s}
.movie:hover .hover{opacity:1}
.hover b{font-size:13px}
.hover .actions{display:flex;gap:6px;margin-top:4px}
.hover button{background:#e50914;border:none;color:#fff;border-radius:3px;padding:3px 6px;font-size:11px;cursor:pointer}

/* PLAYER */
.player-bg{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center;z-index:2000}
.player-box{width:100%;max-width:900px;background:#000}
video{width:100%}
.close{position:absolute;top:15px;right:20px;font-size:40px;cursor:pointer}

/* MODALS */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:3000}
.modal .box{background:#111;padding:20px;border-radius:6px;width:90%;max-width:420px}

/* START / PROFILES */
.start{position:fixed;inset:0;background:#000;z-index:4000;display:flex;align-items:center;justify-content:center;text-align:center}
.start .profiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.start button{padding:12px 18px;font-weight:700}

@media(max-width:600px){.movie{min-width:150px;height:86px}}
</style>
</head>
<body>

<!-- START / PROFILE SELECT + PIN -->
<div class="start" id="start">
  <div>
    <h1>Wybierz profil</h1>
    <div class="profiles">
      <button onclick="selectProfile('User')">User</button>
      <button onclick="selectProfile('Guest')">Guest</button>
    </div>
    <div style="margin-top:12px">
      <input id="pin" type="password" placeholder="PIN (opcjonalny)" />
    </div>
  </div>
</div>

<div class="nav">
  <div class="logo">PORNOFLIX</div>
  <input id="search" placeholder="Szukaj..." />
  <select id="sort" class="sort">
    <option value="popular">Popularne</option>
    <option value="new">Nowe</option>
  </select>
  <button class="btn" onclick="openMyList()">Moja lista</button>
</div>

<div class="hero">
  <h1>Hit miesiąca</h1>
  <p>Goroce Filmy 🔥</p>
</div>

<div class="tabs">
  <div class="tab active" data-tab="fagata">Fagata</div>
  <div class="tab" data-tab="inne">Inne</div>
  <div class="tab" data-tab="top">Top</div>
  <div class="tab" data-tab="nowe">Nowe</div>
</div>

<!-- FAGATA -->
<div class="section active" id="fagata">
  <div class="row"><h2>🔥 Fagata</h2>
    <div class="slider">
      <button class="navbtn prev">‹</button>
      <div class="movies">
        <div class="movie" data-id="p1" data-title="Pizza" data-views="120" data-new="true" data-src="https://www.dropbox.com/scl/fi/7eueybdmdlaa1qkb6sy0r/0hl9rpmc6j21it821880v_720p.mp4?rlkey=38vjflbtwwosp01hmq0a9il54&st=ddnog548&raw=1">
          <span class="badge new">NEW</span>
          <img loading="lazy" src="https://www.dropbox.com/scl/fi/7eueybdmdlaa1qkb6sy0r/0hl9rpmc6j21it821880v_720p.mp4?rlkey=38vjflbtwwosp01hmq0a9il54&st=ddnog548&raw=1" />
          <span class="views">👁 9000</span>
          <div class="hover"><b>Pizza</b><div class="actions"><button onclick="event.stopPropagation();addToList('p1')">＋ Lista</button></div></div>
        </div>
      </div>
      <button class="navbtn next">›</button>
    </div>
<div class="movie" data-id="X" data-title="NAZWA" data-views="0" data-new="true"
     data-src="https://www.dropbox.com/scl/fi/t5rf3twi84xnodqqjpx9x/Gejostwo-Fagata-Czesc-1.mp4?rlkey=0g9ane5thqm9kf5pwk15m8ogu&st=h65s62xh&raw=1"
     data-trailer="">
  <span class="badge new">NEW</span>
  <img loading="lazy" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRx_jcyjiZUf-T5kmFFtl-1-cm3nXiotYmSLg&s&raw=1" />
  <span class="views">👁 0</span>
  <div class="hover">
    <b>Gejostwo Fagata Czesc 1</b>
    <div class="actions">
      <button onclick="event.stopPropagation();addToList('X')">＋ Lista</button>
    </div>
<div class="movie" data-id="X" data-title="NAZWA" data-views="0" data-new="true"
     data-src="https://www.dropbox.com/scl/fi/3qa3grzwhjwzroj78ku6m/Gejostwo-Fagata-Czesc-2.mp4?rlkey=y8yes6tdm4q1mogubi29fabun&st=60wdpwb6&raw=1"
     data-trailer="">
  <span class="badge new">NEW</span>
  <img loading="lazy" src="https://www.reddit.com/media?url=https%3A%2F%2Fpreview.redd.it%2Fptuy7jhy9hte1.jpeg%3Fwidth%3D640%26crop%3Dsmart%26auto%3Dwebp%26s%3Da5d60251790d50bf9e6e2819d292089a99d166ab&raw=1" />
  <span class="views">👁 0</span>
  <div class="hover">
    <b>Gejostwo Fagata Czesc 2</b>
    <div class="actions">
      <button onclick="event.stopPropagation();addToList('X')">＋ Lista</button>
    </div>
  </div>
</div>

<!-- INNE -->
<div class="section" id="inne"><div class="row"><h2>Inne</h2><div class="slider"><button class="navbtn prev">‹</button><div class="movies">
  <div class="movie" data-id="i1" data-title="Sintel" data-views="340" data-src="https://storage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4">
    <span class="badge">TOP</span>
    <img loading="lazy" src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/Sintel_poster.jpg/640px-Sintel_poster.jpg" />
    <span class="views">👁 340</span>
    <div class="hover"><b>Sintel</b><div class="actions"><button onclick="event.stopPropagation();addToList('i1')">＋ Lista</button></div></div>
  </div>
</div><button class="navbtn next">›</button></div></div></div>

<!-- TOP -->
<div class="section" id="top"><div class="row"><h2>Top</h2><div class="slider"><button class="navbtn prev">‹</button><div class="movies">
  <div class="movie" data-id="t1" data-title="Elephants Dream" data-views="980" data-src="https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4">
    <span class="badge">TOP</span>
    <img loading="lazy" src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/Elephants_Dream_s1_proog.jpg/640px-Elephants_Dream_s1_proog.jpg" />
    <span class="views">👁 980</span>
    <div class="hover"><b>Elephants Dream</b><div class="actions"><button onclick="event.stopPropagation();addToList('t1')">＋ Lista</button></div></div>
  </div>
</div><button class="navbtn next">›</button></div></div></div>

<!-- NOWE -->
<div class="section" id="nowe"><div class="row"><h2>Nowe</h2><div class="slider"><button class="navbtn prev">‹</button><div class="movies">
  <div class="movie" data-id="n1" data-title="Flower" data-views="55" data-new="true" data-src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">
    <span class="badge new">NEW</span>
    <img loading="lazy" src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?q=80&w=800" />
    <span class="views">👁 55</span>
    <div class="hover"><b>Flower</b><div class="actions"><button onclick="event.stopPropagation();addToList('n1')">＋ Lista</button></div></div>
  </div>
</div><button class="navbtn next">›</button></div></div></div>

<!-- PLAYER -->
<div class="player-bg" id="playerBg"><span class="close" id="closeBtn">&times;</span><div class="player-box"><video id="videoPlayer" controls playsinline></video></div></div>

<!-- MY LIST MODAL -->
<div class="modal" id="mylist"><div class="box"><h3>Moja lista</h3><div id="list"></div><button class="btn" onclick="closeMyList()">Zamknij</button></div></div>

<script>
/* START / PROFILE + PIN */
function selectProfile(p){const pin=document.getElementById('pin').value||'';localStorage.setItem('profile',p);localStorage.setItem('pin',pin);document.getElementById('start').style.display='none'}

/* TABS */
const tabs=document.querySelectorAll('.tab');const sections=document.querySelectorAll('.section');
tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));sections.forEach(s=>s.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.tab).classList.add('active');window.scrollTo({top:0})});

/* SEARCH */
document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.movie').forEach(m=>m.style.display=m.dataset.title.toLowerCase().includes(q)?'':'none')}

/* SORT */
document.getElementById('sort').onchange=e=>{
  document.querySelectorAll('.movies').forEach(box=>{
    [...box.children].sort((a,b)=>e.target.value==='popular'?(b.dataset.views||0)-(a.dataset.views||0):((b.dataset.new==='true')-(a.dataset.new==='true'))).forEach(el=>box.appendChild(el))
  })
}

/* SLIDERS */
document.querySelectorAll('.slider').forEach(sl=>{const box=sl.querySelector('.movies');sl.querySelector('.prev').onclick=()=>box.scrollBy({left:-300,behavior:'smooth'});sl.querySelector('.next').onclick=()=>box.scrollBy({left:300,behavior:'smooth'})});

/* PLAYER + TRAILER MINI */
const bg=document.getElementById('playerBg');const player=document.getElementById('videoPlayer');const closeBtn=document.getElementById('closeBtn');
document.querySelectorAll('.movie').forEach(m=>{
  let t; m.onclick=()=>{player.muted=false;player.src=m.dataset.src;bg.style.display='flex';player.play();incViews(m)};
  m.onmouseenter=()=>{if(m.dataset.trailer){t=setTimeout(()=>{player.muted=true;player.src=m.dataset.trailer;bg.style.display='flex';player.play()},600)}};
  m.onmouseleave=()=>{clearTimeout(t);if(player.muted){player.pause();bg.style.display='none'}};
});
closeBtn.onclick=()=>{player.pause();player.src='';bg.style.display='none'}

/* VIEWS */
function incViews(m){const v=(+m.dataset.views||0)+1;m.dataset.views=v;m.querySelector('.views').innerText='👁 '+v}

/* MY LIST (HTML + localStorage) */
function addToList(id){const k='mylist';const l=JSON.parse(localStorage.getItem(k)||'[]');if(!l.includes(id)){l.push(id);localStorage.setItem(k,JSON.stringify(l))}}
function openMyList(){renderList();document.getElementById('mylist').style.display='flex'}
function closeMyList(){document.getElementById('mylist').style.display='none'}
function renderList(){const el=document.getElementById('list');const l=JSON.parse(localStorage.getItem('mylist')||'[]');el.innerHTML=l.map(id=>{const m=document.querySelector(`.movie[data-id="${id}"]`);return m?`<div style="display:flex;gap:8px;margin-bottom:8px"><img src="${m.querySelector('img').src}" width="80"><div>${m.dataset.title}</div></div>`:''}).join('')||'<p>Pusto</p>'}
</script>
</body>
</html>
