<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona głowna</title>

    <!-- Particles.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@3.0.0/tsparticles.bundle.min.js"></script>

    <style>
        :root {
            --bg-dark: #0d0d0f;
            --bg-dark2: #1a1b1f;
            --bg-light: #f5f5f5;
            --bg-light2: #ffffff;
            --text-dark: #e5e5e5;
            --text-light: #222;
            --card-dark: #26272b;
            --card-light: #eaeaea;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* Background container for particles */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        header {
            padding: 40px 0;
            font-size: 2.5rem;
            font-weight: 600;
            transition: color .3s;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 900px;
            padding-bottom: 40px;
            z-index: 2;
        }

        .card {
            padding: 25px;
            border-radius: 14px;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: 500;
            transition: 0.3s ease;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            font-size: 0.9rem;
            opacity: .6;
        }

        /* THEME LIGHT */
        body.light {
            background: var(--bg-light);
            color: var(--text-light);
        }

        body.light .card {
            background: var(--card-light);
            color: #111;
            border-color: rgba(0,0,0,0.1);
        }

        /* THEME DARK */
        body.dark {
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-dark2));
            color: var(--text-dark);
        }

        body.dark .card {
            background: var(--card-dark);
            color: white;
            border-color: rgba(255,255,255,0.1);
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 0 30px rgba(0,0,0,0.4);
        }

        /* BUTTON THEME */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.3);
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            user-select: none;
            transition: 0.3s;
            z-index: 3;
            backdrop-filter: blur(6px);
        }

        body.light .theme-toggle {
            background: rgba(255,255,255,0.6);
            color: #333;
        }

    </style>
</head>
<body class="dark">

<div id="particles"></div>

<div class="theme-toggle" id="toggleBtn">🌙 Tryb ciemny</div>

<header>📺 Moje Multimedia</header>

<div class="menu">
 <a class="card" href="Filmy.html">
        <div class="icon">📁</div>
        Filmy
    </a>

    <a class="card" href="">
        <div class="icon">📙</div>
        Librus
    </a>
        <a class="card" href="#">
        <div class="icon">⭐</div>
        Wkrótce
    </a>
</div>

<footer>© 2025 – Profesjonalna Strona</footer>

<script>
    /* --- MODE SWITCH --- */
    const btn = document.getElementById("toggleBtn");
    const body = document.body;

    btn.onclick = () => {
        if (body.classList.contains("dark")) {
            body.classList.remove("dark");
            body.classList.add("light");
            btn.textContent = "🌞 Tryb jasny";
        } else {
            body.classList.remove("light");
            body.classList.add("dark");
            btn.textContent = "🌙 Tryb ciemny";
        }
    };

    /* --- PARTICLES --- */
    tsParticles.load("particles", {
        particles: {
            number: { value: 80 },
            size: { value: 3 },
            move: { enable: true, speed: 1 },
            links: { enable: true, distance: 120 }
        }
    });
</script>

</body>
</html>
