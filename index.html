    <script src="https://cdn.jsdelivr.net/npm/tsparticles@3.0.0/tsparticles.bundle.min.js"></script>

    <style>
        :root {
            --neon: #ff0066;
            --bg-dark1: #0a0a0c;
            --bg-dark2: #16171a;
            --glass: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            animation: fadeIn 1.2s ease-in-out;
            background: linear-gradient(135deg, var(--bg-dark1), var(--bg-dark2));
            color: #e5e5e5;
            transition: background .3s, color .3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #particles { position: fixed; inset: 0; z-index: -1; }

        header {
            padding: 40px 0 20px;
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 12px var(--neon), 0 0 25px var(--neon);
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0% { text-shadow: 0 0 12px var(--neon); }
            50% { text-shadow: 0 0 22px var(--neon), 0 0 40px var(--neon); }
            100% { text-shadow: 0 0 12px var(--neon); }
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
            width: 90%;
            max-width: 900px;
            padding-bottom: 40px;
        }

        .card {
            background: var(--glass);
            padding: 30px;
            border-radius: 18px;
            text-decoration: none;
            font-size: 1.4rem;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            text-align: center;
            color: white;
            transition: .3s;
            animation: slideUp .8s ease forwards;
            transform: translateY(25px);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 0 25px var(--neon);
            border-color: var(--neon);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 12px;
            transition: .3s;
        }

        .card:hover .icon {
            transform: scale(1.2);
            text-shadow: 0 0 20px var(--neon);
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            color: white;
            cursor: pointer;
            transition: .3s;
            z-index: 10;
        }

        .theme-toggle:hover {
            box-shadow: 0 0 20px var(--neon);
        }

        footer { margin-top: auto; padding: 20px; opacity: .5; }

    </style>
</head>
<body class="dark">

<script>
    /* --- DARK / LIGHT MODE --- */
    const btn = document.getElementById("toggleBtn");
    const body = document.body;

    btn.onclick = () => {
        const isDark = body.classList.contains("dark");
        body.classList.toggle("dark", !isDark);
        body.classList.toggle("light", isDark);
        btn.textContent = isDark ? "🌞 Tryb jasny" : "🌙 Tryb ciemny";
        localStorage.setItem("theme", isDark ? "light" : "dark");
    };

    const saved = localStorage.getItem("theme");
    if (saved) body.className = saved;

    /* --- PARTICLES PRO --- */
    tsParticles.load("particles", {
        particles: {
            number: { value: 90 },
            size: { value: 2 },
            move: { enable: true, speed: 1.2 },
            links: { enable: true, distance: 140, color: "#ff0066" },
            color: { value: "#ff0066" },
            opacity: { value: 0.6 }
        },
        interactivity: {
            events: { onHover: { enable: true, mode: "repulse" } },
            modes: { repulse: { distance: 120 } }
        }
    });
</script>

</body>
